name: PR Closed

on:
  pull_request:
    types: [closed]

concurrency:
  # PR open and close use the same group, allowing only one at a time
  group: ${{ github.event.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  cleanup:
    name: Cleanup and Images
    permissions:
      contents: read
      packages: write # retag PR images
    uses: bcgov/actions-openshift/.github/workflows/.pr-close.yml@4dbe4f6d25d14cbdb01e525a302e61e31f96c3ed # v0.5.0
    secrets:
      oc_namespace: ${{ vars.OC_NAMESPACE }}
      oc_token: ${{ secrets.OC_TOKEN }}
    with:
      cleanup: label
