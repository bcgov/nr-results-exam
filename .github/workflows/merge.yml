name: Merge

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - ".github/**"
  workflow_dispatch:

concurrency:
  # Do not interrupt previous workflows
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  vars:
    name: Resolve Images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      pull-requests: read
    strategy:
      matrix:
        package: [backend, frontend]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # Resolve the image digest built for this commit (squash merges walk back to the PR build)
      - name: Resolve image
        id: tracker
        uses: bcgov/actions/image-tracker@4026bfd276b8a5839029106099b13edfb594b2c3 # v0.8.0
        with:
          package: ${{ matrix.package }}
          max_depth: 100

      # Tag that digest with the merge commit SHA; deploys and promotion use this tag
      - name: Tag image with commit SHA
        uses: shrink/actions-docker-registry-tag@v5
        with:
          registry: ghcr.io
          repository: ${{ github.repository }}/${{ matrix.package }}
          target: ${{ steps.tracker.outputs.digest }}
          tags: ${{ github.sha }}

  deploys-test:
    name: Deploys (TEST)
    needs: [vars]
    uses: ./.github/workflows/.deploy.yml
    secrets:
      ches_client_secret: ${{ secrets.CHES_CLIENT_SECRET }}
      oc_token: ${{ secrets.OC_TOKEN }}
      s3_secretkey: ${{ secrets.S3_SECRETKEY }}
    with:
      environment: test
      tag: ${{ github.sha }}
      zone: test
      hostname: results-exam-test.apps.silver.devops.gov.bc.ca
      redirect_url: nr-results-exam-test-frontend.apps.silver.devops.gov.bc.ca

  deploys-prod:
    name: Deploys (PROD)
    needs: [vars, deploys-test]
    uses: ./.github/workflows/.deploy.yml
    secrets:
      ches_client_secret: ${{ secrets.CHES_CLIENT_SECRET }}
      oc_token: ${{ secrets.OC_TOKEN }}
      s3_secretkey: ${{ secrets.S3_SECRETKEY }}
    with:
      environment: prod
      tag: ${{ github.sha }}
      zone: prod
      hostname: results-exam.apps.silver.devops.gov.bc.ca
      redirect_url: nr-results-exam-prod-frontend.apps.silver.devops.gov.bc.ca

  image-promotions:
    name: Promote images
    needs: [vars, deploys-prod]
    permissions:
      packages: write
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        component: [backend, frontend]
    timeout-minutes: 1
    steps:
      - uses: shrink/actions-docker-registry-tag@v5
        with:
          registry: ghcr.io
          repository: ${{ github.repository }}/${{ matrix.component }}
          target: ${{ github.sha }}
          tags: prod
