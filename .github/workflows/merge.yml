name: Merge

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - ".github/**"

concurrency:
  # Do not interrupt previous workflows
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve Images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      pull-requests: read
    timeout-minutes: 5
    outputs:
      digests: ${{ steps.tracker.outputs.digests }}
    steps:
      - uses: actions/checkout@v7

      # Walk per package. An image that was not built for this commit keeps its last digest.
      - name: Resolve images
        id: tracker
        uses: bcgov/actions/image-tracker@4026bfd276b8a5839029106099b13edfb594b2c3 # v0.8.0
        with:
          package: backend, frontend
          max_depth: 100

  deploys-test:
    name: Deploys (TEST)
    needs: [resolve]
    uses: ./.github/workflows/.deploy.yml
    secrets:
      ches_client_secret: ${{ secrets.CHES_CLIENT_SECRET }}
      oc_token: ${{ secrets.OC_TOKEN }}
      s3_secretkey: ${{ secrets.S3_SECRETKEY }}
    with:
      environment: test
      backend_ref: "@${{ fromJSON(needs.resolve.outputs.digests).backend }}"
      frontend_ref: "@${{ fromJSON(needs.resolve.outputs.digests).frontend }}"
      zone: test
      hostname: results-exam-test.apps.silver.devops.gov.bc.ca
      redirect_url: nr-results-exam-test-frontend.apps.silver.devops.gov.bc.ca

  deploys-prod:
    name: Deploys (PROD)
    needs: [resolve, deploys-test]
    uses: ./.github/workflows/.deploy.yml
    secrets:
      ches_client_secret: ${{ secrets.CHES_CLIENT_SECRET }}
      oc_token: ${{ secrets.OC_TOKEN }}
      s3_secretkey: ${{ secrets.S3_SECRETKEY }}
    with:
      environment: prod
      backend_ref: "@${{ fromJSON(needs.resolve.outputs.digests).backend }}"
      frontend_ref: "@${{ fromJSON(needs.resolve.outputs.digests).frontend }}"
      zone: prod
      hostname: results-exam.apps.silver.devops.gov.bc.ca
      redirect_url: nr-results-exam-prod-frontend.apps.silver.devops.gov.bc.ca

  image-promotions:
    name: Promote images
    needs: [resolve, deploys-prod]
    permissions:
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      # Point :prod at the digest that was deployed. An unbuilt package keeps its previous digest.
      - name: Promote backend
        uses: shrink/actions-docker-registry-tag@e6aaef25c595b6e0edd18bf4c7dbfea3abd43299 # v5
        with:
          registry: ghcr.io
          repository: ${{ github.repository }}/backend
          target: ${{ fromJSON(needs.resolve.outputs.digests).backend }}
          tags: prod

      - name: Promote frontend
        uses: shrink/actions-docker-registry-tag@e6aaef25c595b6e0edd18bf4c7dbfea3abd43299 # v5
        with:
          registry: ghcr.io
          repository: ${{ github.repository }}/frontend
          target: ${{ fromJSON(needs.resolve.outputs.digests).frontend }}
          tags: prod
