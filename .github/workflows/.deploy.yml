name: .Deploys

on:
  workflow_call:
    inputs:
      ### Required
      redirect_url:
        description: Frontend redirect from URL
        required: true
        type: string
      backend_tag:
        description: Backend image tag suffix. A tag is :123. A digest is @sha256:...
        required: true
        type: string
      frontend_tag:
        description: Frontend image tag suffix. A tag is :123. A digest is @sha256:...
        required: true
        type: string
      zone:
        description: Deployment zone, e.g. pr-###, test or prod
        required: true
        type: string

      hostname:
        description: Frontend hostname (without protocol), e.g. nr-results-exam-12-frontend.apps.silver.devops.gov.bc.ca
        required: true
        type: string

      ### Optional
      environment:
        description: GitHub/OpenShift environment; usually PR number, test or prod
        default: ""
        type: string

    secrets:
      ches_client_secret:
        description: CHES client secret
        required: true
      oc_token:
        description: OpenShift token
        required: true
      s3_secretkey:
        description: S3 secret key
        required: true

jobs:
  deploy-backend:
    name: Deploy Backend
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: bcgov/actions-openshift/deployer@75454b2b33edf37135f6f167775c77a3414207f6 # v0.3.1
        id: deploy-backend
        with:
          file: backend/openshift.deploy.yml
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          oc_server: ${{ vars.OC_SERVER }}
          oc_token: ${{ secrets.oc_token }}
          parameters: -p ZONE=${{ inputs.zone }}
            -p TAG=${{ inputs.backend_tag }}
            -p CHES_CLIENT_SECRET=${{ secrets.ches_client_secret }}
            -p HOSTNAME=${{ inputs.hostname }}
            -p S3_SECRETKEY=${{ secrets.s3_secretkey }}

  deploy-frontend:
    name: Deploy Frontend
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: bcgov/actions-openshift/deployer@75454b2b33edf37135f6f167775c77a3414207f6 # v0.3.1
        id: deploy-frontend
        with:
          file: frontend/openshift.deploy.yml
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          oc_server: ${{ vars.OC_SERVER }}
          oc_token: ${{ secrets.oc_token }}
          parameters: -p ZONE=${{ inputs.zone }}
            -p TAG=${{ inputs.frontend_tag }}
            -p HOSTNAME=${{ inputs.hostname }}
            -p REDIRECT_URL=${{ inputs.redirect_url }}
            -p VITE_USER_POOLS_WEB_CLIENT_ID=${{ vars.VITE_USER_POOLS_WEB_CLIENT_ID }}

  smoke:
    name: Smoke Tests
    needs: [deploy-backend, deploy-frontend]
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Run smoke tests
        working-directory: tests
        env:
          FRONTEND_URL: https://${{ inputs.hostname }}
          REDIRECT_URL: https://${{ inputs.redirect_url }}
          SMOKE_MAX_RETRIES: "5"
          SMOKE_RETRY_DELAY: "5000"
          SMOKE_MAX_RETRY_DELAY: "40000"
        run: |
          npm ci
          npm run smoke
