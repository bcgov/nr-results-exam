name: .Deploys

on:
  workflow_call:
    inputs:
      ### Required
      redirect_url:
        description: Frontend redirect from URL
        required: true
        type: string
      backend_tag:
        description: Backend image tag suffix. A tag is :123. A digest is @sha256:...
        required: true
        type: string
      frontend_tag:
        description: Frontend image tag suffix. A tag is :123. A digest is @sha256:...
        required: true
        type: string
      zone:
        description: Deployment zone, e.g. pr-###, test or prod
        required: true
        type: string

      hostname:
        description: Frontend hostname (without protocol), e.g. nr-results-exam-12-frontend.apps.silver.devops.gov.bc.ca
        required: true
        type: string

      ### Optional
      environment:
        description: GitHub/OpenShift environment; usually PR number, test or prod
        default: ""
        type: string

    secrets:
      ches_client_secret:
        description: CHES client secret
        required: true
      oc_token:
        description: OpenShift token
        required: true
      s3_secretkey:
        description: S3 secret key
        required: true

jobs:
  deploy-backend:
    name: Deploy Backend
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: bcgov/actions-openshift/deployer@4ad9f97c20e0e00454bfd35e54537ee8622fa166 # v0.7.0
        id: deploy-backend
        with:
          file: backend/openshift.deploy.yml
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          oc_server: ${{ vars.OC_SERVER }}
          oc_token: ${{ secrets.oc_token }}
          parameters: -p ZONE=${{ inputs.zone }}
            -p TAG=${{ inputs.backend_tag }}
            -p CHES_CLIENT_SECRET=${{ secrets.ches_client_secret }}
            -p HOSTNAME=${{ inputs.hostname }}
            -p S3_SECRETKEY=${{ secrets.s3_secretkey }}
            -p KEYCLOAK_ISSUER_URI=${{ vars.KEYCLOAK_ISSUER_URI || 'https://dev.loginproxy.gov.bc.ca/auth/realms/standard' }}
            -p KEYCLOAK_CLIENT_ID=${{ vars.KEYCLOAK_CLIENT_ID || 'nr-results-exam-frontend' }}

  deploy-frontend:
    name: Deploy Frontend
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: bcgov/actions-openshift/deployer@4ad9f97c20e0e00454bfd35e54537ee8622fa166 # v0.7.0
        id: deploy-frontend
        with:
          file: frontend/openshift.deploy.yml
          oc_namespace: ${{ vars.OC_NAMESPACE }}
          oc_server: ${{ vars.OC_SERVER }}
          oc_token: ${{ secrets.oc_token }}
          parameters: -p ZONE=${{ inputs.zone }}
            -p TAG=${{ inputs.frontend_tag }}
            -p HOSTNAME=${{ inputs.hostname }}
            -p REDIRECT_URL=${{ inputs.redirect_url }}
            -p KEYCLOAK_ISSUER_URI=${{ vars.KEYCLOAK_ISSUER_URI || 'https://dev.loginproxy.gov.bc.ca/auth/realms/standard' }}
            -p KEYCLOAK_CLIENT_ID=${{ vars.KEYCLOAK_CLIENT_ID || 'nr-results-exam-frontend' }}

  smoke:
    name: Smoke Tests
    needs: [deploy-backend, deploy-frontend]
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Run smoke tests
        working-directory: tests
        env:
          FRONTEND_URL: https://${{ inputs.hostname }}
          REDIRECT_URL: https://${{ inputs.redirect_url }}
          SMOKE_MAX_RETRIES: "5"
          SMOKE_RETRY_DELAY: "5000"
          SMOKE_MAX_RETRY_DELAY: "40000"
        run: |
          npm ci
          npm test
          npm run smoke
